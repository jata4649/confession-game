<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ことばの告白</title><link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<main id="app" class="app-shell" aria-live="polite"></main>
<template id="landing-template">
  <section class="landing">
    <p class="eyebrow">ONLINE PARTY GAME</p><h1>ことばの告白<span>♡</span></h1>
    <p class="lead">カードを重ねて、今夜だけの告白をつくろう。<br>一文ずつ、みんなの画面に届く。</p>
    <div class="landing-actions"><button class="button primary" data-action="show-create">ルームをつくる</button><button class="button ghost" data-action="show-join">ルームに参加する</button></div>
    <div class="howto"><b>遊び方</b><span>カードで告白を作る → 順番に読み上げる → いちばん心に残った告白を選ぶ</span></div>
  </section>
</template>
<template id="create-template">
  <section class="panel form-panel"><button class="back" data-action="home">‹ 戻る</button><p class="eyebrow">CREATE ROOM</p><h2>はじめよう</h2>
  <label>あなたのニックネーム<input id="create-name" maxlength="16" placeholder="例：みさき" autofocus></label>
  <div class="form-grid"><label>最大人数<select id="max-players"><option>4</option><option selected>6</option><option>8</option></select></label><label>ラウンド数<select id="rounds"><option>1</option><option selected>3</option><option>5</option></select></label><label>手札枚数<select id="card-count"><option>3</option><option selected>5</option><option>6</option></select></label></div>
  <button class="button primary" data-action="create">ルームを作成する</button></section>
</template>
<template id="join-template">
  <section class="panel form-panel"><button class="back" data-action="home">‹ 戻る</button><p class="eyebrow">JOIN ROOM</p><h2>合流しよう</h2>
  <label>あなたのニックネーム<input id="join-name" maxlength="16" placeholder="例：ゆうき" autofocus></label><label>ルームID<input id="join-room" inputmode="numeric" maxlength="6" placeholder="6桁のルームID"></label>
  <button class="button primary" data-action="join">参加する</button></section>
</template>
<script th:src="@{/js/app.js}"></script>
</body></html>
